name: Clasificar motivos recurrentes

on:
  schedule:
    # Lunes 08:00 hora de Paraguay (UTC-3) = 11:00 UTC
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clasificacion-motivos-recurrentes
  cancel-in-progress: false

jobs:
  clasificar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests

      - name: Clasificar títulos pendientes hasta completar el catálogo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/clasificar_motivos_recurrentes.py
