name: Sincronizar Intercom a Supabase

on:
  schedule:
    # Cada 15 minutos (sincronización rápida de 2 días)
    - cron: '*/15 * * * *'
    # Una vez al día a las 03:00 AM UTC (sincronización profunda de 30 días)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Sincronizador
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Si son las 03:00 UTC ejecuta 30 días, en otro momento 2 días
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq "03" ]; then
            python sync_intercom.py --dias 30
          else
            python sync_intercom.py --dias 2
          fi
